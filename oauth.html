<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กำลังกลับไปที่แอป…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:#F7F7F8;color:#111114;padding:24px;text-align:center}
  .card{max-width:340px}
  h1{font-size:1.15rem;margin:0 0 8px}
  p{color:#4B4B55;margin:0 0 18px;font-size:.95rem}
  a.btn{display:inline-block;background:#2F5BFF;color:#fff;text-decoration:none;
        padding:12px 22px;border-radius:12px;font-weight:600}
  code{background:#EFEFF2;padding:2px 6px;border-radius:6px;font-size:.85rem}
  @media (prefers-color-scheme:dark){
    body{background:#111114;color:#F2F2F4} p{color:#A5A5B0} code{background:#26262C}
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="h">กำลังกลับไปที่แอป…</h1>
  <p id="p">ถ้าไม่เด้งกลับเอง ให้กดปุ่มด้านล่าง</p>
  <a class="btn" id="go" href="#">กลับไปที่แอป</a>
</div>
<script>
(function(){
  /* Google hands the token back in the URL fragment. Pass it to the app through its
     own scheme; the query string survives the hop more reliably than a fragment. */
  var hash = (location.hash || '').replace(/^#/, '');
  if(!hash && location.search) hash = location.search.replace(/^\?/, '');
  var target = 'mytodolist://oauth?h=' + encodeURIComponent(hash);
  var go = document.getElementById('go');
  go.setAttribute('href', target);
  if(!hash){
    document.getElementById('h').textContent = 'ไม่พบข้อมูลการอนุญาต';
    document.getElementById('p').textContent = 'ลองกดเชื่อมต่อ Google ในแอปอีกครั้ง';
    go.style.display = 'none';
    return;
  }
  /* clear the token out of the address bar before anything else */
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  setTimeout(function(){ try{ location.replace(target); }catch(e){} }, 60);
})();
</script>
</body>
</html>
